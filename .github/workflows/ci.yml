name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m tests.test_pipeline
      - run: python -m tests.test_v3
      - run: python -m tests.test_v4
      - run: python -m tests.test_idle
      - run: python tests/test_keychain_windows.py
